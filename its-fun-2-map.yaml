# its-fun-2-map — conda environment
#
# Target platform: linux-64. Several of the bioconda tools below have no
# osx-arm64 build, so Apple Silicon needs `CONDA_SUBDIR=osx-64` and Rosetta.
#
#   conda env create -f its-fun-2-map.yaml
#   conda activate its-fun-2-map
#
# This is a curated list of what the pipeline actually calls, not a
# `conda env export` dump — conda resolves the transitive tree (compilers,
# BLAS, fonts, compression and TLS libraries) by itself. Please do not paste
# `conda env export` output back over this file. If you need a byte-exact
# record of a solved environment, write it to a separate lock file:
#
#   conda env export > its-fun-2-map.lock.yaml

name: its-fun-2-map

channels:
  - conda-forge
  - bioconda

dependencies:
  # --- language runtimes ---
  - python=3.14          # floor is 3.12 (seqpy-tools sets requires-python >=3.12)
  - r-base=4.5.2         # embedded by rpy2, never invoked as Rscript. Keep on 4.5.x

  # --- read QC and sequence utilities ---
  - fastp=1.0.1          # step 1: trimming, merging, overlap plots
  - seqkit=2.12.0        # steps 1, 7/9, 11: stats, grep, amplicon

  # --- mapping and assembly ---
  - bwa=0.7.19           # step 3: index, mem, aln, samse, sampe
  - samtools=1.22.1      # step 3: view, sort, fastq, flagstat
  - bbmap=40.02          # step 3: repair.sh, read-pair resynchronisation
  - openjdk=21           # BBMap is a Java application. bbmap only asks for
                         # >=11.0.1, which floats to 25; pin it so the JVM
                         # under a fixed BBMap does not drift.
  - spades=4.2.0         # step 4: assembly

  # --- taxonomic assignment ---
  - blast=2.17.0         # steps 5-10: blastn, makeblastdb

  # --- R packages ---
  - r-jsonlite=2.0.0     # parse_fastp_json.R

  # --- Python packages ---
  - pandas=2.3.3         # do not downgrade: 2.3.3 is the oldest build with a
                         # cp314 variant, so this is the floor under python 3.14
  - numpy=2.4.1
  - biopython=1.86       # Bio.Entrez (steps 2, 2b), Bio.SeqIO (step 12)
  - rpy2=3.6.4           # build encodes both py3.14 and R 4.5 — see r-base above
  - scipy=1.18.0         # declared dependency of seqpy-tools
  - openpyxl=3.1.5       # pandas .xlsx engine, for seqpy_tools.xlsx2csv
  - pgzip=0.4.0          # imported at seqpy_tools module load
  - pip

  # Listing the packages above in conda means pip finds seqpy-tools'
  # requirements already satisfied and installs only seqpy-tools itself,
  # rather than laying its own wheels over the conda builds.
  - pip:
      - seqpy-tools==0.1.0
