name: its-fun-2-map
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.14
  - r-base=4.5.2
  - fastp=1.0.1
  - seqkit=2.12.0
  - bwa=0.7.19
  - samtools=1.22.1
  - bbmap=40.02
  - openjdk=21
  - spades=4.2.0
  - blast=2.17.0
  - r-jsonlite=2.0.0
  - pandas=2.3.3
  - numpy=2.4.1
  - biopython=1.86
  - rpy2=3.6.4
  - scipy=1.18.0
  - openpyxl=3.1.5
  - pgzip=0.4.0
  - pip
  # Listing the packages above in conda means pip finds seqpy-tools'
  # requirements already satisfied and installs only seqpy-tools itself,
  # rather than laying its own wheels over the conda builds.
  - pip:
      - seqpy-tools==0.1.0
